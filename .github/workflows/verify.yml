name: verify

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!README*.md"
      - "!LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./scripts/verify.sh
