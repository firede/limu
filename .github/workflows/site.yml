name: site

# Builds the website, the playground with it, and deploys it to Cloudflare as a release of
# limu is published, from the release's tag, or by hand, from the branch chosen. A release of
# limumygo, tagged limumygo/v…, does not deploy it. Needs the repository's secret
# CLOUDFLARE_API_TOKEN: a token that may edit Workers (Cloudflare's "Edit Cloudflare
# Workers" template).
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: site
      url: https://limu.firede.com
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      # limumygo asks for a newer Go than limu does, as MyGo does.
      - uses: actions/setup-go@v6
        with:
          go-version-file: limumygo/go.mod
          cache-dependency-path: limumygo/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # pnpm has a deploy command of its own; run calls the website's script.
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
